# Integrated HTTP stack for local validation. Production TLS and deployment are added in Milestone 9.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  media-init:
    build:
      context: ./backend
    user: "0:0"
    command: ["sh", "-c", "chown 65532:65532 /data/media && chmod 0700 /data/media"]
    volumes:
      - media-data:/data/media
    network_mode: none
    restart: "no"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://messenger:change-me@postgres:5432/messenger}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8080"]}
      MEDIA_ROOT: /data/media
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cleanup:
    build:
      context: ./backend
    command: ["python", "-m", "messenger.cleanup_messages"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://messenger:change-me@postgres:5432/messenger}
      MEDIA_ROOT: /data/media
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_DEVICE_PAIRING_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:8080"]}'
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_DEVICE_PAIRING_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:8080"]}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${YV_CHAT_LOCAL_BIND_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  media-data:
  postgres-data:
