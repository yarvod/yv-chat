map $http_upgrade $yv_chat_connection_upgrade {
    default upgrade;
    '' close;
}

# This zone is unique to chat.yoowee.ru and is applied only to the standalone
# invitation redemption endpoint below. It does not throttle other API routes,
# virtual hosts, or services sharing this Nginx process.
limit_req_zone $binary_remote_addr zone=yv_chat_registration_per_ip:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.yoowee.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.yoowee.ru;

    ssl_certificate /etc/letsencrypt/live/chat.yoowee.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.yoowee.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 150m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Video notes use getUserMedia only after an explicit user gesture. Keep
    # sensitive capture APIs limited to this top-level origin and never delegate
    # them to cross-origin content.
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(self)" always;
    # OpenMLS is compiled to WebAssembly. `wasm-unsafe-eval` permits only WASM
    # compilation; unlike `unsafe-eval`, it does not enable JavaScript eval().
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' wss://chat.yoowee.ru; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;

    location = /api/v1/auth/register {
        limit_req zone=yv_chat_registration_per_ip burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $yv_chat_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
