map $http_upgrade $yv_chat_connection_upgrade {
    default upgrade;
    '' close;
}

# This zone is unique to the yv-chat vhost and is applied only to the standalone
# invitation redemption endpoint in the shared server snippet.
limit_req_zone $binary_remote_addr zone=yv_chat_registration_per_ip:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.yoowee.ru chat.yoowee.com.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.yoowee.ru;

    ssl_certificate /etc/letsencrypt/live/chat.yoowee.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.yoowee.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/yv-chat-server.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.yoowee.com.de;

    ssl_certificate /etc/letsencrypt/live/chat.yoowee.com.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.yoowee.com.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/yv-chat-server.conf;
}
