map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Mirror the production shared-NAT pairing budget so local two-device QA catches
# unpaced QR history uploads and ACK bursts before deployment.
limit_req_zone $binary_remote_addr zone=yv_chat_pairing_local:1m rate=120r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 150m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/v1/device-pairings/ {
        limit_req zone=yv_chat_pairing_local burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 704k;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
