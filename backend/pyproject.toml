[project]
name = "yv-chat-backend"
version = "0.1.0"
description = "Backend for the yv-chat private messenger"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "dishka>=1.10.0,<2.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "import-linter>=2.0.0,<3.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messenger"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL test database"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_packages = ["messenger"]

[[tool.importlinter.contracts]]
name = "Domain has no inward dependencies"
type = "forbidden"
source_modules = ["messenger.domain"]
forbidden_modules = [
    "messenger.application",
    "messenger.bootstrap",
    "messenger.infrastructure",
    "messenger.presentation",
]

[[tool.importlinter.contracts]]
name = "Application does not know outer layers"
type = "forbidden"
source_modules = ["messenger.application"]
forbidden_modules = [
    "messenger.bootstrap",
    "messenger.infrastructure",
    "messenger.presentation",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not know delivery or composition"
type = "forbidden"
source_modules = ["messenger.infrastructure"]
forbidden_modules = ["messenger.bootstrap", "messenger.presentation"]
