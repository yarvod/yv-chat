name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://messenger:ci-only-password@127.0.0.1:5432/messenger
      TEST_DATABASE_URL: postgresql+asyncpg://messenger:ci-only-password@127.0.0.1:5432/messenger
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: messenger
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Apply migrations to a fresh database
        run: uv run alembic upgrade head
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy .
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  crypto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.91.0
          target: wasm32-unknown-unknown
          components: rustfmt, clippy
          cache-workspaces: crypto
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint native targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Lint WASM target
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Test native provider
        run: cargo test --locked
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Compile and verify release WASM boundary
        working-directory: .
        run: make crypto-wasm-bindgen
      - name: Reject sensitive OpenMLS debug features
        run: |
          ! cargo tree --locked -e features -i openmls |
            grep -Eq 'openmls feature "(content-debug|crypto-debug|test-utils)"'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate development Compose
        run: docker compose -f compose.dev.yml config --quiet
      - name: Validate integrated Compose
        run: docker compose config --quiet
      - name: Validate production deployment artifacts
        run: make compose-check deploy-check
