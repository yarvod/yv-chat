name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: yv-chat-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: chat.yoowee.ru
  DEPLOY_USER: devuser
  DEPLOY_PORT: "22"
  DEPLOY_ROOT: /home/devuser/yv-chat

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://messenger:deploy-ci-only@127.0.0.1:5432/messenger
      TEST_DATABASE_URL: postgresql+asyncpg://messenger:deploy-ci-only@127.0.0.1:5432/messenger
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: messenger
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: deploy-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          cd backend
          uv sync --frozen
          cd ../frontend
          npm ci
      - name: Apply migrations to the fresh verification database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Verify repository
        run: make ci
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.images.outputs.image_prefix }}
      image_tag: ${{ steps.images.outputs.image_tag }}
    steps:
      - id: images
        name: Resolve immutable image coordinates
        shell: bash
        run: |
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deployment-config:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned SSH access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error title=Missing deployment secret::DEPLOY_KEY is not configured in the production environment or repository"
            exit 1
          fi
          key_file="$RUNNER_TEMP/yv-chat-deploy-key"
          public_key_file="$RUNNER_TEMP/yv-chat-deploy-key.pub"
          trap 'rm -f "$key_file" "$public_key_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          if ! ssh-keygen -y -f "$key_file" > "$public_key_file"; then
            echo "::error title=Invalid deployment secret::DEPLOY_KEY is not a readable SSH private key"
            exit 1
          fi
          deploy_key_fingerprint=$(ssh-keygen -l -E sha256 -f "$public_key_file" | awk '{print $2}')
          if ! ssh \
            -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/ssh_known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'test "$(id -un)" = devuser && test -d /home/devuser/yv-chat'; then
            echo "::error title=SSH authentication failed::DEPLOY_KEY public fingerprint $deploy_key_fingerprint is not authorized for devuser@chat.yoowee.ru"
            exit 1
          fi

  build:
    needs: [verify, prepare, deployment-config]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.component }}:${{ needs.prepare.outputs.image_tag }}
            ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

  deploy:
    needs: [prepare, deployment-config, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKEND_IMAGE: ${{ needs.prepare.outputs.image_prefix }}-backend
      FRONTEND_IMAGE: ${{ needs.prepare.outputs.image_prefix }}-frontend
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/yv-chat-deploy-key"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Copy versioned deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/yv-chat-deploy-key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/ssh_known_hosts"
          )
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_ROOT/deploy/nginx'"
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" \
            compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/compose.prod.yml"
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" \
            deploy/bootstrap-server.sh deploy/remote-deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/deploy/"
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" \
            deploy/nginx/gateway.conf \
            deploy/nginx/host-chat.http.conf \
            deploy/nginx/host-chat.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/deploy/nginx/"
      - name: Migrate and roll out isolated stack
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/yv-chat-deploy-key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/ssh_known_hosts"
          )
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$DEPLOY_ROOT/deploy/remote-deploy.sh'"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_ROOT='$DEPLOY_ROOT' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' IMAGE_TAG='$IMAGE_TAG' GHCR_USER='$GHCR_USER' '$DEPLOY_ROOT/deploy/remote-deploy.sh'"
      - name: Remove ephemeral SSH identity
        if: always()
        run: rm -f "$RUNNER_TEMP/yv-chat-deploy-key"
