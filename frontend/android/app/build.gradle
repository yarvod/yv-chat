apply plugin: 'com.android.application'

def nativeVersionProperties = new Properties()
def nativeVersionFile = rootProject.file('../native-version.properties')
if (!nativeVersionFile.exists()) {
    throw new GradleException("Missing native version file: ${nativeVersionFile}")
}
nativeVersionFile.withInputStream { nativeVersionProperties.load(it) }

def nativeVersionCode = nativeVersionProperties.getProperty('VERSION_CODE')
def nativeVersionName = nativeVersionProperties.getProperty('VERSION_NAME')
if (!(nativeVersionCode ==~ /[1-9][0-9]*/) || !(nativeVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('native-version.properties must contain positive VERSION_CODE and SemVer VERSION_NAME')
}

def releaseSigningValues = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD'),
]
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def releaseSigningComplete = releaseSigningValues.values().every { it != null && !it.isBlank() }
if (releaseTaskRequested && !releaseSigningComplete) {
    throw new GradleException('Release signing requires ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD')
}

android {
    namespace = "de.com.yoowee.chat"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.com.yoowee.chat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nativeVersionCode.toInteger()
        versionName nativeVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningComplete) {
            release {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningComplete) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
