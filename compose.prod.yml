services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 320m
    pids_limit: 128
    shm_size: 64m

  media-init:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    user: "0:0"
    command: ["sh", "-c", "chown 65532:65532 /data/media && chmod 0700 /data/media"]
    volumes:
      - media-data:/data/media
    network_mode: none
    restart: "no"
    mem_limit: 32m
    pids_limit: 16
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]

  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["https://chat.yoowee.ru"]}'
      TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:-["172.30.243.1/32"]}'
      ACTIVATION_TOKEN_TTL_SECONDS: ${ACTIVATION_TOKEN_TTL_SECONDS:-86400}
      PASSWORD_RESET_TOKEN_TTL_SECONDS: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:-3600}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-2592000}
      SESSION_ABSOLUTE_LIFETIME_SECONDS: ${SESSION_ABSOLUTE_LIFETIME_SECONDS:-7776000}
      SESSION_ROTATION_INTERVAL_SECONDS: ${SESSION_ROTATION_INTERVAL_SECONDS:-86400}
      SESSION_PREVIOUS_TOKEN_GRACE_SECONDS: ${SESSION_PREVIOUS_TOKEN_GRACE_SECONDS:-60}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      SECURITY_EVENT_RETENTION_SECONDS: ${SECURITY_EVENT_RETENTION_SECONDS:-7776000}
      SYNC_EVENT_RETENTION_SECONDS: ${SYNC_EVENT_RETENTION_SECONDS:-2592000}
      MESSAGE_CIPHERTEXT_RETENTION_SECONDS: ${MESSAGE_CIPHERTEXT_RETENTION_SECONDS:-2592000}
      MESSAGE_TOMBSTONE_RETENTION_SECONDS: ${MESSAGE_TOMBSTONE_RETENTION_SECONDS:-7776000}
      MESSAGE_CLEANUP_BATCH_SIZE: ${MESSAGE_CLEANUP_BATCH_SIZE:-200}
      MESSAGE_CLEANUP_INTERVAL_SECONDS: ${MESSAGE_CLEANUP_INTERVAL_SECONDS:-300}
      MEDIA_IMAGE_MAX_BYTES: ${MEDIA_IMAGE_MAX_BYTES:-12582912}
      MEDIA_VIDEO_MAX_BYTES: ${MEDIA_VIDEO_MAX_BYTES:-104857600}
      MEDIA_FILE_MAX_BYTES: ${MEDIA_FILE_MAX_BYTES:-26214400}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-157286400}
      MEDIA_PENDING_RETENTION_SECONDS: ${MEDIA_PENDING_RETENTION_SECONDS:-86400}
      MEDIA_CLEANUP_BATCH_SIZE: ${MEDIA_CLEANUP_BATCH_SIZE:-100}
      MEDIA_ROOT: /data/media
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required}
      VAPID_CONTACT: ${VAPID_CONTACT:?VAPID_CONTACT is required}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-300}
      PUSH_TIMEOUT_SECONDS: ${PUSH_TIMEOUT_SECONDS:-5}
    volumes:
      - media-data:/data/media
    ports:
      - 127.0.0.1:${YV_CHAT_API_BIND_PORT:-18081}:8000
    networks: [ingress, private]
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]

  cleanup:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["python", "-m", "messenger.cleanup_messages"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["https://chat.yoowee.ru"]}'
      TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:-["172.30.243.1/32"]}'
      SYNC_EVENT_RETENTION_SECONDS: ${SYNC_EVENT_RETENTION_SECONDS:-2592000}
      MESSAGE_CIPHERTEXT_RETENTION_SECONDS: ${MESSAGE_CIPHERTEXT_RETENTION_SECONDS:-2592000}
      MESSAGE_TOMBSTONE_RETENTION_SECONDS: ${MESSAGE_TOMBSTONE_RETENTION_SECONDS:-7776000}
      MESSAGE_CLEANUP_BATCH_SIZE: ${MESSAGE_CLEANUP_BATCH_SIZE:-200}
      MESSAGE_CLEANUP_INTERVAL_SECONDS: ${MESSAGE_CLEANUP_INTERVAL_SECONDS:-300}
      MEDIA_IMAGE_MAX_BYTES: ${MEDIA_IMAGE_MAX_BYTES:-12582912}
      MEDIA_VIDEO_MAX_BYTES: ${MEDIA_VIDEO_MAX_BYTES:-104857600}
      MEDIA_FILE_MAX_BYTES: ${MEDIA_FILE_MAX_BYTES:-26214400}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-157286400}
      MEDIA_PENDING_RETENTION_SECONDS: ${MEDIA_PENDING_RETENTION_SECONDS:-86400}
      MEDIA_CLEANUP_BATCH_SIZE: ${MEDIA_CLEANUP_BATCH_SIZE:-100}
      MEDIA_ROOT: /data/media
    volumes:
      - media-data:/data/media
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 96m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - 127.0.0.1:${YV_CHAT_FRONTEND_BIND_PORT:-18082}:3000
    networks: [ingress]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]

networks:
  ingress:
    ipam:
      config:
        - subnet: 172.30.243.0/24
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.242.0/24

volumes:
  media-data:
  postgres-data:
