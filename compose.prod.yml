services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 320m
    pids_limit: 128
    shm_size: 64m

  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["https://chat.yoowee.ru"]}'
      TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:-["172.30.242.10/32"]}'
      ACTIVATION_TOKEN_TTL_SECONDS: ${ACTIVATION_TOKEN_TTL_SECONDS:-86400}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-2592000}
      SESSION_ABSOLUTE_LIFETIME_SECONDS: ${SESSION_ABSOLUTE_LIFETIME_SECONDS:-7776000}
      SESSION_ROTATION_INTERVAL_SECONDS: ${SESSION_ROTATION_INTERVAL_SECONDS:-86400}
      SESSION_PREVIOUS_TOKEN_GRACE_SECONDS: ${SESSION_PREVIOUS_TOKEN_GRACE_SECONDS:-60}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      SECURITY_EVENT_RETENTION_SECONDS: ${SECURITY_EVENT_RETENTION_SECONDS:-7776000}
      MEDIA_ROOT: /data/media
    volumes:
      - media-data:/data/media
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    networks: [private]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]

  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - 127.0.0.1:${YV_CHAT_BIND_PORT:-18080}:80
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
      private:
        ipv4_address: 172.30.242.10
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=4m
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.242.0/24

volumes:
  media-data:
  postgres-data:
